<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadmintonSense | 运动感知推理展示</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div id="app-container">

        <!-- 顶部品牌栏 -->
        <header>
            <div class="brand">
                <h1>BadmintonSense <span>Motion Analysis</span></h1>
            </div>
            <div class="btn-group">
                <input type="text" id="wsUrl" class="btn" style="width: 200px; text-align: left;"
                       value="ws://localhost:8090" placeholder="接收端 WebSocket 地址">
                <button id="connectBtn" class="btn btn-primary" onclick="toggleReceiverConnection()">
                    连接接收端
                </button>
            </div>
        </header>

        <!-- 连接状态 -->
        <div class="connection-status" id="connectionStatus">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">未连接</span>
        </div>

        <!-- 统计看板 -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">已接收动作</span>
                <span class="stat-value" id="totalActions">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">预测正确</span>
                <span class="stat-value" id="correctCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">预测错误</span>
                <span class="stat-value" id="wrongCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">正确率</span>
                <span class="stat-value" id="accuracy">0%</span>
            </div>
        </div>

        <!-- 当前推理结果大卡片 -->
        <div class="prediction-card" id="predictionCard">
            <div class="prediction-placeholder" id="predictionPlaceholder">
                等待推理结果...
            </div>
            <div class="prediction-content" id="predictionContent" style="display: none;">
                <div class="prediction-header">
                    <span class="prediction-label">动作 #<span id="actionNum">-</span></span>
                    <span class="prediction-sample-id">sample_id: <span id="sampleId">-</span></span>
                </div>
                <div class="prediction-main">
                    <div class="prediction-result" id="predictionResult">
                        <div class="result-icon" id="resultIcon"></div>
                        <div class="result-details">
                            <div class="result-predicted">
                                <span class="result-label-text">预测结果</span>
                                <span class="result-value" id="predictedLabelName">-</span>
                            </div>
                            <div class="result-actual">
                                <span class="result-label-text">真实标签</span>
                                <span class="result-value" id="actualLabelName">-</span>
                            </div>
                        </div>
                    </div>
                    <div class="prediction-confidence">
                        <div class="confidence-header">
                            <span class="confidence-label">置信度</span>
                            <span class="confidence-value" id="confidenceValue">-</span>
                        </div>
                        <div class="confidence-bar-track">
                            <div class="confidence-bar-fill" id="confidenceBar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 推理历史列表 -->
        <div class="history-card">

            <div class="history-card-header">
                <h3>推理历史记录</h3>
                <button class="btn btn-small" onclick="clearHistory()" style="color: #ef4444; border-color: #ef4444;">
                    清空
                </button>
            </div>
            <div class="history-list" id="historyList">
                <p class="history-empty">暂无推理记录</p>
            </div>
        </div>

    </div>

    <script src="js/main.js"></script>
</body>
</html>
